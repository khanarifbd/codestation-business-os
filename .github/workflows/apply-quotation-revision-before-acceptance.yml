name: Apply quotation revision patch

on:
  push:
    branches:
      - fix/quotation-revision-before-acceptance
    paths:
      - .github/workflows/apply-quotation-revision-before-acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quotation-revision-before-acceptance
      - name: Apply patch
        run: python scripts/_apply_quotation_revision_patch.py
      - name: Commit patch
        run: |
          rm scripts/_apply_quotation_revision_patch.py
          rm .github/workflows/apply-quotation-revision-before-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sales): allow quotation revisions before acceptance"
          git push origin HEAD:fix/quotation-revision-before-acceptance
