name: Cleanup non-core branches

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cleanup-non-core-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main and develop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if [ "$branch" = "main" ] || [ "$branch" = "develop" ]; then
              echo "Keeping $branch"
              continue
            fi
            echo "Deleting $branch"
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote("heads/" + sys.argv[1], safe=""))' "$branch")
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${encoded}"
          done <<< "$branches"
