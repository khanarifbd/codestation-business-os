name: Temp CRM Opportunity Currency UI

on:
  push:
    branches: [fix/crm-opportunity-currency]

permissions:
  contents: write

jobs:
  cleanup-currency-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crm-opportunity-currency
      - name: Make opportunity currency read-only outside edit mode
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/lead-requirements-card.tsx')
          text = path.read_text()
          old = '''    <div className="mt-3 grid gap-2 rounded-xl border bg-neutral-50 p-3 sm:grid-cols-[220px_1fr] sm:items-end">\n      <SearchableSelect label="Opportunity currency" value={opportunityCurrency} onValueChange={changeOpportunityCurrency} options={CURRENCY_OPTIONS} searchPlaceholder="Search currency..." required clearable={false} />\n      <p className="pb-1 text-xs leading-5 text-neutral-500">Used for estimated requirement values and the future quotation. Your company base/reporting currency remains separate.</p>\n    </div>\n'''
          new = '''    <div className="mt-3 grid gap-2 rounded-xl border bg-neutral-50 p-3 sm:grid-cols-[220px_1fr] sm:items-end">\n      {editing ? <SearchableSelect label="Opportunity currency" value={opportunityCurrency} onValueChange={changeOpportunityCurrency} options={CURRENCY_OPTIONS} searchPlaceholder="Search currency..." required clearable={false} /> : <div><p className="text-xs font-medium text-neutral-600">Opportunity currency</p><p className="mt-2 flex h-11 items-center rounded-xl border bg-white px-3 text-sm font-semibold">{opportunityCurrency}</p></div>}\n      <p className="pb-1 text-xs leading-5 text-neutral-500">Used for estimated requirement values and the future quotation. Your company base/reporting currency remains separate.</p>\n    </div>\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one currency panel, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit UI cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/lead-requirements-card.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(crm): clarify opportunity currency edit state"
          git push origin HEAD:fix/crm-opportunity-currency
