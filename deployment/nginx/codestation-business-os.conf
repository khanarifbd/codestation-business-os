# Shared coarse edge protection for public authentication routes. FastAPI also
# enforces identity-aware database-backed limits, so direct API access is covered.
limit_req_zone $binary_remote_addr zone=business_os_auth:10m rate=30r/m;

# CodeStation Business OS frontend
server {
    listen 80;
    listen [::]:80;
    server_name os.codestationai.com;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # These are browser-facing BFF endpoints, so limiting only api-os would not
    # protect password/verification traffic initiated through the web app.
    location ^~ /api/auth/ {
        limit_req zone=business_os_auth burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This Nginx server is the public ingress. Overwrite any browser-supplied
        # forwarding header so application security logs cannot be IP-spoofed.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# CodeStation Business OS API
server {
    listen 80;
    listen [::]:80;
    server_name api-os.codestationai.com;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /api/v1/auth/ {
        limit_req zone=business_os_auth burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS is installed by the deployment/certbot layer. Strict-Transport-Security
# must be set on the HTTPS virtual host/terminating proxy, not relied on here at
# the plain-HTTP origin layer.
