name: Phase 4 Frontend Patch

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare Phase 4 frontend lazy-load patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Apply asserted Phase 4 frontend patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, minimum: int = 1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} matches, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          # Expenses: keep lightweight vendor/category/account metadata on bootstrap;
          # load relationship catalogs only when the expense form is actually opened.
          expenses = "frontend/src/app/dashboard/expenses/page.tsx"
          replace_once(expenses,
          '''  const [profitabilityLoading,setProfitabilityLoading] = useState(false);\n  const [loading,setLoading] = useState(true);''',
          '''  const [profitabilityLoading,setProfitabilityLoading] = useState(false);\n  const [relationshipMetaLoaded,setRelationshipMetaLoaded] = useState(false);\n  const [relationshipMetaLoading,setRelationshipMetaLoading] = useState(false);\n  const [loading,setLoading] = useState(true);''')
          replace_once(expenses,
          '''  const refreshMeta = useCallback(async () => { setMeta(await api("/expense-meta") as Meta); },[api]);''',
          '''  const refreshLiteMeta = useCallback(async () => {\n    const lite = await api("/expense-meta-lite") as Meta;\n    setMeta((current) => ({ ...current, vendors: lite.vendors, categories: lite.categories, accounts: lite.accounts }));\n  },[api]);''')
          replace_once(expenses,
          '''      const [summaryData,metaData,expenseData] = await Promise.all([api("/expense-summary"),api("/expense-meta"),api(`/expenses?${new URLSearchParams({limit:"50"})}`)]);''',
          '''      const [summaryData,metaData,expenseData] = await Promise.all([api("/expense-summary"),api("/expense-meta-lite"),api(`/expenses?${new URLSearchParams({limit:"50"})}`)]);''')
          replace_once(expenses,
          '''  function openExpense() { const account=meta.accounts.find((item)=>item.is_active);const category=meta.categories.find((item)=>item.is_active);setExpenseForm({...blankExpense,account_id:account?.id||"",category_id:category?.id||"",expense_currency:account?.currency||"USD"});setError(null);setModal("expense"); }''',
          '''  async function openExpense() {\n    setError(null);\n    let nextMeta = meta;\n    if (!relationshipMetaLoaded) {\n      setRelationshipMetaLoading(true);\n      try {\n        nextMeta = await api("/expense-meta") as Meta;\n        setMeta(nextMeta);\n        setRelationshipMetaLoaded(true);\n      } catch (reason) {\n        setError(reason instanceof Error ? reason.message : "Unable to load expense relationships.");\n        return;\n      } finally {\n        setRelationshipMetaLoading(false);\n      }\n    }\n    const account=nextMeta.accounts.find((item)=>item.is_active);\n    const category=nextMeta.categories.find((item)=>item.is_active);\n    setExpenseForm({...blankExpense,account_id:account?.id||"",category_id:category?.id||"",expense_currency:account?.currency||"USD"});\n    setModal("expense");\n  }''')
          replace_all(expenses, "refreshMeta()", "refreshLiteMeta()", 4)
          replace_once(expenses,
          '''<button onClick={openExpense} className="rounded-xl bg-neutral-950 px-4 py-3 text-sm font-semibold text-white">+ New expense</button>''',
          '''<button onClick={()=>void openExpense()} disabled={relationshipMetaLoading} className="rounded-xl bg-neutral-950 px-4 py-3 text-sm font-semibold text-white disabled:opacity-50">{relationshipMetaLoading?"Loading...":"+ New expense"}</button>''')

          # Capital: overview first; fetch metadata and each list only when that tab is opened.
          capital = "frontend/src/app/dashboard/capital/page.tsx"
          replace_once(capital,
          '''import { FormEvent, useEffect, useMemo, useState } from "react";''',
          '''import { FormEvent, useCallback, useEffect, useMemo, useState } from "react";''')
          replace_once(capital,
          '''  const[loading,setLoading]=useState(true),[busy,setBusy]=useState(false);\n  const[error,setError]=useState<string|null>(null),[success,setSuccess]=useState<string|null>(null);\n\n  useEffect(()=>{void loadAll()},[]);\n  async function loadAll(){\n    setLoading(true);setError(null);\n    try{\n      const[m,d,c,p,i]=await Promise.all([\n        api<Meta>("/api/capital/meta"), api<Dashboard>("/api/capital/dashboard"),\n        api<CompanyInvestor[]>("/api/capital/company-investors"), api<ProjectInvestor[]>("/api/capital/project-investors"),\n        api<Investment[]>("/api/capital/investments")\n      ]);\n      setMeta(m);setDashboard(d);setCompanyInvestors(c);setProjectInvestors(p);setInvestments(i);\n    }catch(e){setError(e instanceof Error?e.message:"Unable to load Investments & Funding")}finally{setLoading(false)}\n  }\n  async function post(path:string,payload:Record<string,unknown>,message:string,form?:HTMLFormElement){\n    setBusy(true);setError(null);setSuccess(null);\n    try{await api(`/api/capital/${path}`,{method:"POST",body:JSON.stringify(payload)});form?.reset();setSuccess(message);await loadAll()}\n    catch(e){setError(e instanceof Error?e.message:"Request failed")}finally{setBusy(false)}\n  }''',
          '''  const[loading,setLoading]=useState(true),[busy,setBusy]=useState(false);\n  const[tabLoading,setTabLoading]=useState(false);\n  const[loadedTabs,setLoadedTabs]=useState<Set<Tab>>(()=>new Set(["overview"]));\n  const[error,setError]=useState<string|null>(null),[success,setSuccess]=useState<string|null>(null);\n\n  const loadOverview=useCallback(async(showLoader=false)=>{\n    if(showLoader)setLoading(true);\n    setError(null);\n    try{setDashboard(await api<Dashboard>("/api/capital/dashboard"))}\n    catch(e){setError(e instanceof Error?e.message:"Unable to load Investments & Funding")}\n    finally{if(showLoader)setLoading(false)}\n  },[]);\n\n  const loadTab=useCallback(async(target:Exclude<Tab,"overview">,force=false)=>{\n    if(!force&&loadedTabs.has(target))return;\n    setTabLoading(true);setError(null);\n    try{\n      const[nextMeta,rows]=await Promise.all([\n        !force&&meta?Promise.resolve(meta):api<Meta>("/api/capital/meta"),\n        target==="company"?api<CompanyInvestor[]>("/api/capital/company-investors"):\n          target==="project"?api<ProjectInvestor[]>("/api/capital/project-investors"):\n          api<Investment[]>("/api/capital/investments")\n      ]);\n      setMeta(nextMeta);\n      if(target==="company")setCompanyInvestors(rows as CompanyInvestor[]);\n      else if(target==="project")setProjectInvestors(rows as ProjectInvestor[]);\n      else setInvestments(rows as Investment[]);\n      setLoadedTabs(current=>{const next=new Set(current);next.add(target);return next});\n    }catch(e){setError(e instanceof Error?e.message:"Unable to load capital workspace")}\n    finally{setTabLoading(false)}\n  },[loadedTabs,meta]);\n\n  useEffect(()=>{void loadOverview(true)},[loadOverview]);\n  useEffect(()=>{if(tab==="overview"||loadedTabs.has(tab))return;void loadTab(tab)},[tab,loadedTabs,loadTab]);\n\n  async function refreshCurrent(){\n    if(tab==="overview"){await loadOverview();return}\n    await Promise.all([loadOverview(),loadTab(tab,true)]);\n  }\n\n  async function post(path:string,payload:Record<string,unknown>,message:string,form?:HTMLFormElement){\n    setBusy(true);setError(null);setSuccess(null);\n    try{\n      await api(`/api/capital/${path}`,{method:"POST",body:JSON.stringify(payload)});\n      form?.reset();setSuccess(message);\n      if(tab==="overview")await loadOverview();\n      else await Promise.all([loadOverview(),loadTab(tab,true)]);\n    }\n    catch(e){setError(e instanceof Error?e.message:"Request failed")}finally{setBusy(false)}\n  }''')
          replace_once(capital,
          '''<button onClick={()=>void loadAll()} disabled={busy} className="inline-flex h-10 items-center gap-2 rounded-xl border bg-white px-4 text-sm"><RefreshCw className="size-4"/>Refresh</button>''',
          '''<button onClick={()=>void refreshCurrent()} disabled={busy||tabLoading} className="inline-flex h-10 items-center gap-2 rounded-xl border bg-white px-4 text-sm disabled:opacity-50"><RefreshCw className="size-4"/>Refresh</button>''')
          replace_once(capital,
          '''    {tab==="overview"?<Overview data={dashboard}/>:null}\n    {tab==="company"?<CompanyFunding items={companyInvestors} accounts={accountOptions} busy={busy} post={post}/>:null}\n    {tab==="project"?<ProjectFunding items={projectInvestors} projects={projectOptions} meta={meta} accounts={accountOptions} busy={busy} post={post}/>:null}\n    {tab==="ours"?<OurInvestments items={investments} accounts={accountOptions} busy={busy} post={post}/>:null}''',
          '''    {tab==="overview"?<Overview data={dashboard}/>:null}\n    {tab!=="overview"&&tabLoading?<div className="flex min-h-72 items-center justify-center rounded-3xl border bg-white"><Loader2 className="size-6 animate-spin text-neutral-400"/></div>:null}\n    {tab==="company"&&!tabLoading?<CompanyFunding items={companyInvestors} accounts={accountOptions} busy={busy} post={post}/>:null}\n    {tab==="project"&&!tabLoading?<ProjectFunding items={projectInvestors} projects={projectOptions} meta={meta} accounts={accountOptions} busy={busy} post={post}/>:null}\n    {tab==="ours"&&!tabLoading?<OurInvestments items={investments} accounts={accountOptions} busy={busy} post={post}/>:null}''')

          # HR: share access state at the HR layout boundary so nav + page do not request it twice.
          Path("frontend/src/components/hr-access-context.tsx").write_text('''"use client";\n\nimport { createContext, useContext, useEffect, useState } from "react";\nimport { useRouter } from "next/navigation";\nimport type { HRAccess } from "@/components/hr-module-nav";\n\ntype HRAccessState = { access: HRAccess | null; loading: boolean; error: string | null };\nconst HRAccessContext = createContext<HRAccessState | null>(null);\n\nexport function HRAccessProvider({ children }: { children: React.ReactNode }) {\n  const router = useRouter();\n  const [state, setState] = useState<HRAccessState>({ access: null, loading: true, error: null });\n  useEffect(() => {\n    let cancelled = false;\n    void (async () => {\n      try {\n        const response = await fetch("/api/hr/access", { cache: "no-store" });\n        if (response.status === 401) { router.replace("/login"); return; }\n        const payload = await response.json().catch(() => null);\n        if (!response.ok) throw new Error(payload?.detail ?? "Unable to load HR access.");\n        if (!cancelled) setState({ access: payload as HRAccess, loading: false, error: null });\n      } catch (reason) {\n        if (!cancelled) setState({ access: null, loading: false, error: reason instanceof Error ? reason.message : "Unable to load HR access." });\n      }\n    })();\n    return () => { cancelled = true; };\n  }, [router]);\n  return <HRAccessContext.Provider value={state}>{children}</HRAccessContext.Provider>;\n}\n\nexport function useHRAccess() {\n  const value = useContext(HRAccessContext);\n  if (!value) throw new Error("useHRAccess must be used within HRAccessProvider");\n  return value;\n}\n''')

          layout = "frontend/src/app/dashboard/hr/layout.tsx"
          Path(layout).write_text('''import { HRAccessProvider } from "@/components/hr-access-context";\nimport { HRModuleNav } from "@/components/hr-module-nav";\n\nexport default function HRLayout({ children }: { children: React.ReactNode }) {\n  return <HRAccessProvider><HRModuleNav />{children}</HRAccessProvider>;\n}\n''')

          nav = "frontend/src/components/hr-module-nav.tsx"
          replace_once(nav,
          '''import { useEffect, useMemo, useState } from "react";''',
          '''import { useMemo } from "react";''')
          replace_once(nav,
          '''import {\n  CalendarClock,''',
          '''import { useHRAccess } from "@/components/hr-access-context";\nimport {\n  CalendarClock,''')
          replace_once(nav,
          '''  const [access, setAccess] = useState<HRAccess | null>(null);\n  const [loading, setLoading] = useState(true);\n\n  useEffect(() => {\n    let cancelled = false;\n    void (async () => {\n      try {\n        const response = await fetch("/api/hr/access", { cache: "no-store" });\n        if (response.status === 401) { router.replace("/login"); return; }\n        if (!response.ok) return;\n        const payload = (await response.json()) as HRAccess;\n        if (!cancelled) setAccess(payload);\n      } finally {\n        if (!cancelled) setLoading(false);\n      }\n    })();\n    return () => { cancelled = true; };\n  }, [router]);''',
          '''  const { access, loading } = useHRAccess();''')

          hr = "frontend/src/app/dashboard/hr/page.tsx"
          replace_once(hr,
          '''import type { HRAccess } from "@/components/hr-module-nav";''',
          '''import { useHRAccess } from "@/components/hr-access-context";''')
          replace_once(hr,
          '''  const [access, setAccess] = useState<HRAccess | null>(null);\n  const [summary, setSummary] = useState<Summary | null>(null);''',
          '''  const { access, loading: accessLoading, error: accessError } = useHRAccess();\n  const [summary, setSummary] = useState<Summary | null>(null);''')
          replace_once(hr,
          '''  useEffect(() => {\n    let cancelled = false;\n    void (async () => {\n      try {\n        const nextAccess = await readJson<HRAccess>("/api/hr/access");\n        if (cancelled) return;\n        setAccess(nextAccess);\n        if (!nextAccess.can_view) {\n          if (nextAccess.can_view_people) router.replace("/dashboard/hr/people");\n          else if (nextAccess.can_self) router.replace("/dashboard/hr/me");\n          else setError("Your company role does not have access to People & HR.");\n          return;\n        }\n        const nextSummary = await readJson<Summary>("/api/hr/workspace-summary");\n        if (!cancelled) setSummary(nextSummary);\n      } catch (reason) {\n        if (!cancelled) setError(reason instanceof Error ? reason.message : "Unable to load People & HR.");\n      } finally {\n        if (!cancelled) setLoading(false);\n      }\n    })();\n    return () => { cancelled = true; };\n  }, [router]);''',
          '''  useEffect(() => {\n    if (accessLoading) return;\n    if (!access) { setError(accessError ?? "Your company role does not have access to People & HR."); setLoading(false); return; }\n    if (!access.can_view) {\n      if (access.can_view_people) router.replace("/dashboard/hr/people");\n      else if (access.can_self) router.replace("/dashboard/hr/me");\n      else setError("Your company role does not have access to People & HR.");\n      setLoading(false);\n      return;\n    }\n    let cancelled = false;\n    void readJson<Summary>("/api/hr/workspace-summary")\n      .then((nextSummary) => { if (!cancelled) setSummary(nextSummary); })\n      .catch((reason) => { if (!cancelled) setError(reason instanceof Error ? reason.message : "Unable to load People & HR."); })\n      .finally(() => { if (!cancelled) setLoading(false); });\n    return () => { cancelled = true; };\n  }, [access, accessError, accessLoading, router]);''')

          # Projects: initial bootstrap already includes the first list; don't immediately fetch it again.
          projects = "frontend/src/app/dashboard/projects/page.tsx"
          replace_once(projects,
          '''import { useCallback, useEffect, useMemo, useState } from "react";''',
          '''import { useCallback, useEffect, useMemo, useRef, useState } from "react";''')
          replace_once(projects,
          '''  const [description, setDescription] = useState("");\n\n  useEffect(() => { setOrderId''',
          '''  const [description, setDescription] = useState("");\n  const skipInitialListReload = useRef(true);\n\n  useEffect(() => { setOrderId''')
          replace_once(projects,
          '''  useEffect(() => {\n    if (loading) return;\n    void loadList();\n  }, [query, loadList, loading]);''',
          '''  useEffect(() => {\n    if (loading) return;\n    if (skipInitialListReload.current) { skipInitialListReload.current = false; return; }\n    void loadList();\n  }, [query, loadList, loading]);''')

          # Inventory: keep overview + setup data ready, defer tab-specific history/stock/service terms.
          inventory = "frontend/src/app/dashboard/inventory/page.tsx"
          replace_once(inventory,
          '''  const [transferForm, setTransferForm] = useState({ product_id: "", from_warehouse_id: "", to_warehouse_id: "", transfer_date: today(), quantity: "", reason: "Stock transfer", reference: "" });\n\n  const request''',
          '''  const [transferForm, setTransferForm] = useState({ product_id: "", from_warehouse_id: "", to_warehouse_id: "", transfer_date: today(), quantity: "", reason: "Stock transfer", reference: "" });\n  const [loadedTabs, setLoadedTabs] = useState<Set<Tab>>(() => new Set(["overview", "suppliers", "warehouses"]));\n\n  const request''')
          replace_once(inventory,
          '''  const load = useCallback(async () => {\n    setLoading(true);\n    setError(null);\n    try {\n      const urls = [\n        "/api/inventory/dashboard-summary",\n        "/api/inventory/products?include_inactive=true",\n        "/api/inventory/warehouses",\n        "/api/inventory/categories",\n        "/api/inventory/suppliers?include_inactive=true",\n        "/api/inventory/stock",\n        "/api/inventory/purchases",\n        "/api/inventory/movements",\n        "/api/accounting/tax/codes",\n        "/api/services/catalog?include_inactive=true",\n      ];\n      const payload = await Promise.all(urls.map((url) => request(url)));\n      const serviceTerms = new Map<string, number | null>((Array.isArray(payload[9]) ? payload[9] : []).map((item: { product_id: string; duration_months: number | null }) => [item.product_id, item.duration_months]));\n      setOverview(payload[0]);\n      setBaseCurrency(payload[0].base_currency || "BDT");\n      setProducts((payload[1] as Omit<Product, "service_duration_months">[]).map((item) => ({ ...item, service_duration_months: serviceTerms.get(item.id) ?? null })));\n      setWarehouses(payload[2]);\n      setCategories(payload[3]);\n      setSuppliers(payload[4]);\n      setStock(payload[5]);\n      setPurchases(payload[6]);\n      setMovements(payload[7]);\n      setTaxCodes(payload[8]);\n    } catch (reason) {\n      setError(reason instanceof Error ? reason.message : "Could not load inventory");\n    } finally {\n      setLoading(false);\n    }\n  }, [request]);\n\n  useEffect(() => { void load(); }, [load]);''',
          '''  const loadCore = useCallback(async (showLoader = true) => {\n    if (showLoader) setLoading(true);\n    setError(null);\n    try {\n      const [summaryData, productData, warehouseData, categoryData, supplierData, taxData] = await Promise.all([\n        request("/api/inventory/dashboard-summary"),\n        request("/api/inventory/products?include_inactive=true"),\n        request("/api/inventory/warehouses"),\n        request("/api/inventory/categories"),\n        request("/api/inventory/suppliers?include_inactive=true"),\n        request("/api/accounting/tax/codes"),\n      ]);\n      setOverview(summaryData);\n      setBaseCurrency(summaryData.base_currency || "BDT");\n      setProducts((productData as Omit<Product, "service_duration_months">[]).map((item) => ({ ...item, service_duration_months: null })));\n      setWarehouses(warehouseData);\n      setCategories(categoryData);\n      setSuppliers(supplierData);\n      setTaxCodes(taxData);\n    } catch (reason) {\n      setError(reason instanceof Error ? reason.message : "Could not load inventory");\n    } finally {\n      if (showLoader) setLoading(false);\n    }\n  }, [request]);\n\n  const loadTab = useCallback(async (target: Tab, force = false) => {\n    if (target === "overview" || (!force && loadedTabs.has(target))) return;\n    if (target === "suppliers" || target === "warehouses" || target === "service_sales") {\n      setLoadedTabs((current) => { const next = new Set(current); next.add(target); return next; });\n      return;\n    }\n    setLoading(true);\n    setError(null);\n    try {\n      if (target === "items") {\n        const terms = await request("/api/services/catalog?include_inactive=true");\n        const serviceTerms = new Map<string, number | null>((Array.isArray(terms) ? terms : []).map((item: { product_id: string; duration_months: number | null }) => [item.product_id, item.duration_months]));\n        setProducts((current) => current.map((item) => ({ ...item, service_duration_months: serviceTerms.get(item.id) ?? null })));\n      } else if (target === "purchases") setPurchases(await request("/api/inventory/purchases"));\n      else if (target === "stock") setStock(await request("/api/inventory/stock"));\n      else if (target === "movements") setMovements(await request("/api/inventory/movements"));\n      setLoadedTabs((current) => { const next = new Set(current); next.add(target); return next; });\n    } catch (reason) {\n      setError(reason instanceof Error ? reason.message : "Could not load inventory section");\n    } finally {\n      setLoading(false);\n    }\n  }, [loadedTabs, request]);\n\n  useEffect(() => { void loadCore(); }, [loadCore]);\n  useEffect(() => { if (!loading) void loadTab(tab); }, [tab, loading, loadTab]);''')
          replace_once(inventory,
          '''      setMessage(success);\n      await load();''',
          '''      setMessage(success);\n      setLoadedTabs(new Set(["overview", "suppliers", "warehouses"]));\n      await loadCore(false);\n      if (tab !== "overview") await loadTab(tab, true);''')
          replace_once(inventory,
          '''  async function openTransfer() {\n    if (activeWarehouses.length < 2) {\n      setError("Add at least two active warehouses before transferring stock.");\n      return;\n    }\n    const sourceRow = stock.find((row) => Number(row.on_hand) > 0);''',
          '''  async function openTransfer() {\n    if (activeWarehouses.length < 2) {\n      setError("Add at least two active warehouses before transferring stock.");\n      return;\n    }\n    let availableStock = stock;\n    if (!loadedTabs.has("stock")) {\n      try {\n        availableStock = await request("/api/inventory/stock") as Stock[];\n        setStock(availableStock);\n        setLoadedTabs((current) => { const next = new Set(current); next.add("stock"); return next; });\n      } catch (reason) {\n        setError(reason instanceof Error ? reason.message : "Could not load stock for transfer");\n        return;\n      }\n    }\n    const sourceRow = availableStock.find((row) => Number(row.on_hand) > 0);''')
          replace_once(inventory,
          '''<button onClick={() => void load()} className="inline-flex h-11 items-center gap-2 rounded-xl border bg-white px-4 text-sm"><RefreshCw className="size-4" />Refresh</button>''',
          '''<button onClick={() => void (async () => { setLoadedTabs(new Set(["overview", "suppliers", "warehouses"])); await loadCore(); if (tab !== "overview") await loadTab(tab, true); })()} className="inline-flex h-11 items-center gap-2 rounded-xl border bg-white px-4 text-sm"><RefreshCw className="size-4" />Refresh</button>''')

          print("Phase 4 frontend patch applied")
          PY
      - name: Frontend checks
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api-os.example.com/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: business-os-ci.apps.googleusercontent.com
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      - name: Commit clean patch
        run: |
          rm .github/workflows/phase4-frontend-patch.yml
          git config user.name "CodeStation Phase 4 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend .github/workflows/phase4-frontend-patch.yml
          git commit -m "Finish Phase 4 frontend lazy loading"
          git push origin HEAD:develop
