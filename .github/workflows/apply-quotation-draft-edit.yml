name: Apply quotation draft edit patch

on:
  push:
    branches:
      - fix/quotation-draft-edit
    paths:
      - .github/workflows/apply-quotation-draft-edit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quotation-draft-edit
      - name: Apply scoped quotation editor patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/app/dashboard/quotations/quotation-workspace.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Expected snippet not found:\n{old[:240]}')
              text = text.replace(old, new, 1)

          replace_once(
              '  const [createOpen, setCreateOpen] = useState(false);\n  const [detail, setDetail] = useState<Detail | null>(null);',
              '  const [createOpen, setCreateOpen] = useState(false);\n  const [editingQuotationId, setEditingQuotationId] = useState<string | null>(null);\n  const [detail, setDetail] = useState<Detail | null>(null);',
          )

          replace_once(
              '    const today = localDate();\n    setSourceLeadId(null); setClientId(client?.id || "");',
              '    const today = localDate();\n    setEditingQuotationId(null);\n    setSourceLeadId(null); setClientId(client?.id || "");',
          )

          replace_once(
              '  function openCreate() { if (!meta) return; resetDraft(meta); setCreateOpen(true); }\n  async function openDetail(id: string)',
              '''  function openCreate() { if (!meta) return; resetDraft(meta); setCreateOpen(true); }\n  function openEdit(current: Detail) {\n    if (!meta || current.status !== "draft") return;\n    setEditingQuotationId(current.id);\n    setSourceLeadId(current.source_lead_id);\n    setClientId(current.client_id);\n    setSubject(current.subject ?? "");\n    setIssueDate(current.issue_date);\n    setValidUntil(current.valid_until ?? "");\n    setCurrency(current.currency);\n    setTaxMode(current.tax_calculation_mode);\n    setAssignedEmployeeId(current.assigned_employee_id ?? "");\n    setNotes(current.notes ?? "");\n    setTerms(current.terms_conditions ?? "");\n    setInternalNotes(current.internal_notes ?? "");\n    setItems(current.items.map(item => ({\n      product_id: item.product_id,\n      lead_interest_id: item.lead_interest_id,\n      item_name: item.item_name_snapshot,\n      item_type: item.item_type_snapshot === "non_stock_item" ? "non_stock_item" : "service",\n      unit: item.unit_snapshot || "unit",\n      description: item.description,\n      quantity: Number(item.quantity),\n      unit_price: Number(item.unit_price),\n      discount_percent: Number(item.discount_percent),\n      tax_rate: Number(item.tax_rate),\n    })));\n    setCreateOpen(true);\n  }\n  async function openDetail(id: string)''',
          )

          old_create = '''  async function createQuotation() {\n    if (!clientId) { setError("Select a client."); return; }\n    if (items.some(item => !(item.item_name || item.description).trim() || !item.description.trim() || item.quantity <= 0 || item.unit_price < 0)) { setError("Complete all quotation items."); return; }\n    setSaving(true); setError(null);\n    try {\n      const created = await api("/quotations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ client_id: clientId, source_lead_id: sourceLeadId, subject: subject.trim() || null, issue_date: issueDate, valid_until: validUntil || null, currency, tax_calculation_mode: taxMode, assigned_employee_id: assignedEmployeeId || null, notes: notes.trim() || null, terms_conditions: terms.trim() || null, internal_notes: internalNotes.trim() || null, items }) }) as Detail;\n      setCreateOpen(false); setDetail(created); setMessage(`Quotation ${created.quotation_number} created`); await refreshAffected();\n    } catch (reason) { setError(reason instanceof Error ? reason.message : "Unable to create quotation."); } finally { setSaving(false); }\n  }'''
          new_create = '''  async function createQuotation() {\n    if (!editingQuotationId && !clientId) { setError("Select a client."); return; }\n    if (items.some(item => !(item.item_name || item.description).trim() || !item.description.trim() || item.quantity <= 0 || item.unit_price < 0)) { setError("Complete all quotation items."); return; }\n    setSaving(true); setError(null);\n    try {\n      const quotationPayload = { subject: subject.trim() || null, issue_date: issueDate, valid_until: validUntil || null, currency, tax_calculation_mode: taxMode, assigned_employee_id: assignedEmployeeId || null, notes: notes.trim() || null, terms_conditions: terms.trim() || null, internal_notes: internalNotes.trim() || null, items };\n      if (editingQuotationId) {\n        const updated = await api(`/quotations/${editingQuotationId}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(quotationPayload) }) as Detail;\n        setCreateOpen(false); setEditingQuotationId(null); setDetail(updated); setMessage(`Quotation ${updated.quotation_number} updated`); await refreshAffected();\n      } else {\n        const created = await api("/quotations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ client_id: clientId, source_lead_id: sourceLeadId, ...quotationPayload }) }) as Detail;\n        setCreateOpen(false); setDetail(created); setMessage(`Quotation ${created.quotation_number} created`); await refreshAffected();\n      }\n    } catch (reason) { setError(reason instanceof Error ? reason.message : editingQuotationId ? "Unable to update quotation." : "Unable to create quotation."); } finally { setSaving(false); }\n  }'''
          replace_once(old_create, new_create)

          replace_once(
              '  {createOpen && meta ? <Modal title={sourceLeadId ? "Create quotation from lead" : "Create quotation"} onClose={() => setCreateOpen(false)} wide><div className="space-y-6">\n    {sourceLeadId ? <div className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700">Lead requirements are prefilled below. You can adjust descriptions, quantity and final pricing before saving the quotation.</div> : null}',
              '  {createOpen && meta ? <Modal title={editingQuotationId ? "Edit quotation" : sourceLeadId ? "Create quotation from lead" : "Create quotation"} onClose={() => { setCreateOpen(false); setEditingQuotationId(null); }} wide><div className="space-y-6">\n    {sourceLeadId && !editingQuotationId ? <div className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700">Lead requirements are prefilled below. You can adjust descriptions, quantity and final pricing before saving the quotation.</div> : null}',
          )

          old_client = '<SearchableSelect label="Client" name="quotation_client" value={clientId} onValueChange={value => { setClientId(value); const c = clients.find(item => item.id === value); if (c?.currency) setCurrency(c.currency); setSourceLeadId(null); }} options={clientOptions} searchPlaceholder="Search client by code or name..." />'
          new_client = '{editingQuotationId ? <Field label="Client" value={detail?.client_name_snapshot ?? clients.find(item => item.id === clientId)?.display_name ?? ""} onChange={() => undefined} disabled /> : <SearchableSelect label="Client" name="quotation_client" value={clientId} onValueChange={value => { setClientId(value); const c = clients.find(item => item.id === value); if (c?.currency) setCurrency(c.currency); setSourceLeadId(null); }} options={clientOptions} searchPlaceholder="Search client by code or name..." />}'
          replace_once(old_client, new_client)

          replace_once(
              '<button onClick={() => setCreateOpen(false)} className="h-11 rounded-xl border px-4 text-sm font-semibold">Cancel</button><button disabled={saving} onClick={() => void createQuotation()} className="h-11 rounded-xl bg-neutral-950 px-5 text-sm font-semibold text-white disabled:opacity-50">{saving ? "Creating…" : "Create draft"}</button>',
              '<button onClick={() => { setCreateOpen(false); setEditingQuotationId(null); }} className="h-11 rounded-xl border px-4 text-sm font-semibold">Cancel</button><button disabled={saving} onClick={() => void createQuotation()} className="h-11 rounded-xl bg-neutral-950 px-5 text-sm font-semibold text-white disabled:opacity-50">{saving ? (editingQuotationId ? "Saving…" : "Creating…") : (editingQuotationId ? "Save changes" : "Create draft")}</button>',
          )

          replace_once(
              '<Drawer detail={detail} loading={detailLoading} saving={saving} onClose={() => setDetail(null)} onStatus={changeStatus} onOrder={id => router.push(`/dashboard/orders?quotation_id=${encodeURIComponent(id)}`)} />',
              '<Drawer detail={detail} loading={detailLoading} saving={saving} onClose={() => setDetail(null)} onEdit={openEdit} onStatus={changeStatus} onOrder={id => router.push(`/dashboard/orders?quotation_id=${encodeURIComponent(id)}`)} />',
          )

          replace_once(
              'function Drawer({ detail, loading, saving, onClose, onStatus, onOrder }: { detail: Detail | null; loading: boolean; saving: boolean; onClose: () => void; onStatus: (s: "sent" | "accepted" | "rejected" | "cancelled") => Promise<void>; onOrder: (id: string) => void })',
              'function Drawer({ detail, loading, saving, onClose, onEdit, onStatus, onOrder }: { detail: Detail | null; loading: boolean; saving: boolean; onClose: () => void; onEdit: (detail: Detail) => void; onStatus: (s: "sent" | "accepted" | "rejected" | "cancelled") => Promise<void>; onOrder: (id: string) => void })',
          )

          replace_once(
              '{detail.status === "draft" ? <><Action label="Mark Sent" primary disabled={saving} onClick={() => void onStatus("sent")} /><Action label="Cancel" disabled={saving} onClick={() => void onStatus("cancelled")} /></> : null}',
              '{detail.status === "draft" ? <><Action label="Edit" disabled={saving} onClick={() => onEdit(detail)} /><Action label="Mark Sent" primary disabled={saving} onClick={() => void onStatus("sent")} /><Action label="Cancel" disabled={saving} onClick={() => void onStatus("cancelled")} /></> : null}',
          )

          path.write_text(text)
          Path('.github/workflows/apply-quotation-draft-edit.yml').unlink()
          PY
      - name: Commit scoped change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/dashboard/quotations/quotation-workspace.tsx .github/workflows/apply-quotation-draft-edit.yml
          git commit -m "feat(sales): enable draft quotation editing"
          git push origin HEAD:fix/quotation-draft-edit
