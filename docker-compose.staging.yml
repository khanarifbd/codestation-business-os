services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: sqlite:////data/codestation_business_os.db
    volumes:
      - business_os_sqlite:/data
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  business_os_sqlite:
