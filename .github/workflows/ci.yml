name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: business_os
          POSTGRES_PASSWORD: business_os_ci
          POSTGRES_DB: codestation_business_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_os -d codestation_business_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://business_os:business_os_ci@127.0.0.1:5432/codestation_business_os
      JWT_SECRET_KEY: ci-only-secret-change-me-32-bytes-minimum
      GOOGLE_OAUTH_CLIENT_ID: business-os-ci.apps.googleusercontent.com
      PROJECT_CREDENTIAL_ENCRYPTION_KEY: ci-only-project-credential-key-0123456789abcdef
      SUPER_ADMIN_EMAIL: admin@codestationai.com
      SUPER_ADMIN_PASSWORD: ci-super-admin-password
      SUPER_ADMIN_NAME: CodeStation AI Super Admin
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run python -m compileall app alembic scripts
      - name: Run portable HR, team and release regressions (no external database)
        env:
          ENVIRONMENT: test
        run: |
          for test_file in \
            test_candidate_conversion_atomicity_offline.py \
            test_candidate_conversion_transaction_sqlite.py \
            test_hr_talent_read_contract_offline.py \
            test_team_patch_name_integrity_offline.py \
            test_release_security_unit.py \
            test_client_invitations_unit.py \
            test_hr_document_upload_commit_safety_offline.py \
            test_deploy_reexec_lock_unit.py \
            test_restore_compose_target_unit.py \
            test_restore_verification_failures_unit.py \
            test_stripe_sandbox_replay_offline.py \
            test_public_checkout_suspension_offline.py \
            test_hr_document_revocation_offline.py \
            test_inventory_depletion_cost_offline.py \
            test_inventory_failure_paths_offline.py \
            test_payroll_finalization_failure_offline.py \
            test_quotation_order_failure_offline.py \
            test_source_invoice_transaction_offline.py \
            test_recurring_scheduler_transaction_offline.py \
            test_expense_void_transaction_offline.py \
            test_expense_relationship_context.py \
            test_company_currency_fixture_transaction_unit.py \
            test_finance_controls_fixture_transaction_unit.py \
            test_journal_fixture_gate_unit.py \
            test_browser_fixture_safety_unit.py \
            test_inventory_fixture_transaction_unit.py \
            test_reporting_frontend_contract_unit.py \
            test_secondary_profitability_contract_unit.py
          do
            uv run --offline --no-sync python -m unittest discover -s tests -p "$test_file" -v || exit 1
          done
      - run: uv run alembic upgrade 0008_team_roles
      - run: uv run python scripts/seed_existing_tenant_fixture.py
      - run: uv run alembic upgrade head
      - name: Verify synthetic PostgreSQL payment and void concurrency
        timeout-minutes: 10
        env:
          ENVIRONMENT: test
          QC_PAYMENT_VOID_CONCURRENCY: "1"
        run: uv run python scripts/verify_qc_payment_void_concurrency.py
      - run: uv run python scripts/verify_onboarding_organization.py
      - run: uv run python scripts/verify_google_auth.py
      - run: uv run python scripts/verify_auth_launch_security.py
      - run: uv run python scripts/verify_user_profile.py
      - run: uv run python scripts/verify_passkeys.py
      - run: uv run python scripts/verify_session_idle.py
      - run: uv run python scripts/verify_company_currency_settings.py
      - run: uv run python scripts/verify_reporting_currency.py
      - run: uv run python scripts/verify_functional_currency_change.py
      - run: uv run python scripts/verify_currency_business_date.py
      - run: uv run python scripts/verify_v1_accounting_integrity.py
      - run: uv run python scripts/verify_accounting_api_hardening.py
      - run: uv run python scripts/verify_atomic_financial_flow.py
      - run: uv run python scripts/audit_accounting_integrity.py --organization-name-prefix "Atomic Accounting "
      - run: uv run python scripts/verify_performance_indexes.py
      - run: uv run python scripts/verify_crm_migration_fixture.py
      - run: uv run python scripts/verify_crm_won_flow.py
      - run: uv run python scripts/verify_crm_settings_management.py
      - run: uv run python scripts/verify_client_workspace.py
      - run: uv run python scripts/verify_sales.py
      - run: uv run python scripts/verify_quotation_v2_api.py
      - run: uv run python scripts/verify_orders.py
      - run: uv run python scripts/verify_order_commercial.py
      - run: uv run python scripts/verify_quotation_order_billing.py
      - run: uv run python scripts/verify_projects.py
      - run: uv run python scripts/verify_project_execution.py
      - run: uv run python scripts/verify_finance.py
      - run: uv run python scripts/verify_stripe_gateway_connections.py
      - run: uv run python scripts/verify_stripe_manual_credentials.py
      - run: uv run python scripts/verify_stripe_sandbox_checkout.py
      - run: uv run python scripts/verify_stripe_account_mapping.py
      - run: uv run python scripts/verify_stripe_settlement.py
      - run: uv run python scripts/verify_stripe_accounting_posting.py
      - run: uv run python scripts/verify_stripe_payout_lifecycle.py
      - run: uv run python scripts/verify_stripe_live_accounting.py
      - run: uv run python scripts/verify_stripe_invoice_payment_links.py
      - run: uv run python scripts/verify_finance_performance.py
      - run: uv run python scripts/verify_transfers.py
      - run: uv run python scripts/verify_expenses.py
      - run: uv run python scripts/verify_accounting_money_integrity.py
      - run: uv run python scripts/verify_financial_idempotency.py
      - run: uv run python scripts/verify_finance_controls.py
      - run: uv run python scripts/verify_exchange_rate_provider.py
      - run: uv run python scripts/verify_reconciliation.py
      - run: uv run python scripts/verify_accounting_read_performance.py
      - run: uv run python scripts/verify_fixed_assets.py
      - run: uv run python scripts/verify_finance_control_classification.py
      - run: uv run python scripts/verify_tax_center.py
      - run: uv run python scripts/verify_inventory.py
      - run: uv run python scripts/verify_inventory_management.py
      - run: uv run python scripts/verify_inventory_workflows.py
      - run: uv run python scripts/verify_inventory_sales.py
      - run: uv run python scripts/verify_phase4_read_performance.py
      - run: uv run python scripts/verify_phase4_remaining_performance.py
      - run: uv run python scripts/verify_phase5_architecture.py
      - run: uv run python scripts/verify_sales_catalog_flow.py
      - run: uv run python scripts/verify_recurring_auto_post.py
      - run: uv run python scripts/verify_payroll.py
      - run: uv run python scripts/verify_hr.py
      - run: uv run python scripts/verify_hr_security.py
      - run: uv run python scripts/verify_hr_extended.py
      - run: uv run python scripts/verify_hr_workspace.py
      - run: uv run python scripts/verify_hr_attendance.py
      - run: uv run python scripts/verify_capital.py
      - run: uv run python scripts/verify_accounting_loans.py
      - run: uv run python scripts/verify_accounting_multicurrency.py
      - run: uv run python scripts/verify_reports.py
      - run: uv run python scripts/verify_reports_performance.py
      - run: uv run python scripts/verify_financial_corrections.py
      - run: uv run python scripts/verify_financial_corrections_part2.py
      - run: uv run python scripts/verify_financial_correction_history.py
      - run: uv run python scripts/verify_tenant_isolation.py
      - run: uv run python scripts/verify_multi_org_relationships.py
      - run: uv run python scripts/verify_audit.py
      - run: uv run python scripts/verify_inventory_qa_regressions.py
      - run: uv run python scripts/verify_inventory_payables_migration.py
      - run: uv run python scripts/verify_reporting_qa_regressions.py
      - run: uv run python scripts/verify_qa_hr_leave.py
      - run: uv run python scripts/verify_qa_invoice_ux.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qa_document_downloads.py
      - run: uv run python scripts/verify_secondary_profitability_qa.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qa_invoice_api.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qa_document_http.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_owner_reporting.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_order_milestones.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_dashboard_collections.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_owner_auth_notifications.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_hr_project_extended.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_owner_finance_extended.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_recurring_concurrency.py
      - run: ENVIRONMENT=test uv run python scripts/verify_qc_statement_reversal_chain.py
      - run: uv run python -c "from app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Validate production operations scripts
        working-directory: .
        run: >-
          bash -n
          deployment/deploy.sh
          deployment/migrate-legacy-uploads.sh
          deployment/backup.sh
          deployment/restore.sh
          deployment/install-backup-timer.sh
          deployment/verify-production.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node --test tests/*.cjs tests/capture-json-response.test.mjs
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api-os.example.com/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: business-os-ci.apps.googleusercontent.com
      - name: Verify production frontend Docker build
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=https://api-os.example.com/api/v1
          --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=business-os-ci.apps.googleusercontent.com
          --tag business-os-frontend:ci
          .

  browser-smoke:
    runs-on: ubuntu-latest
    services: &browser-fixture-services
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: business_os
          POSTGRES_PASSWORD: business_os_e2e
          POSTGRES_DB: codestation_business_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_os -d codestation_business_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env: &browser-fixture-env
      DATABASE_URL: postgresql+psycopg://business_os:business_os_e2e@127.0.0.1:5432/codestation_business_os
      JWT_SECRET_KEY: e2e-only-secret-change-me-32-bytes-minimum
      GOOGLE_OAUTH_CLIENT_ID: ""
      PROJECT_CREDENTIAL_ENCRYPTION_KEY: e2e-only-project-credential-key-0123456789abcdef
      SUPER_ADMIN_EMAIL: e2e-super-admin@example.com
      SUPER_ADMIN_PASSWORD: E2E-Launch-Password-123!
      SUPER_ADMIN_NAME: Browser Smoke Super Admin
      PYTHONPATH: .
      ENVIRONMENT: test
      E2E_EMAIL: e2e-owner@example.com
      E2E_PASSWORD: E2E-Launch-Password-123!
      E2E_BASE_URL: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      QC_BROWSER_FIXTURE: "1"
      SMTP_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated browser fixture path
        run: echo "BROWSER_FIXTURE=$RUNNER_TEMP/business-os-browser-fixture.json" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare E2E backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python scripts/seed_browser_e2e.py
          E2E_EMAIL=qc-owner@example.com uv run python scripts/seed_browser_e2e.py
          E2E_EMAIL=qc-masterdata@example.com uv run python scripts/seed_browser_e2e.py
          E2E_EMAIL=qc-hr-project@example.com uv run python scripts/seed_browser_e2e.py
          E2E_EMAIL=qc-financial-ux@example.com uv run python scripts/seed_browser_e2e.py
          E2E_EMAIL=qc-notification@example.com uv run python scripts/seed_browser_e2e.py
          E2E_EMAIL=neutral-theme@example.com uv run python scripts/seed_browser_e2e.py
          uv run python scripts/seed_qc_personal_client_browser.py
          nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/business-os-backend.log 2>&1 &
          backend_pid=$!
          nohup node ../frontend/scripts/ci-transport-observer.cjs --watch-pid "$backend_pid" >/dev/null 2>&1 &
      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/business-os-backend.log || true
          exit 1
      - run: corepack enable
      - name: Build frontend and install Playwright test runner
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false @playwright/test@1.55.0
          pnpm build
      - name: Start isolated development frontend for functional browser QA
        working-directory: frontend
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        run: BOS_TRANSPORT_DIAGNOSTICS=1 NODE_OPTIONS="${NODE_OPTIONS:-} --require=$PWD/scripts/ci-transport-observer.cjs" nohup pnpm exec next dev --turbopack -H 127.0.0.1 -p 3000 >/tmp/business-os-frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/business-os-frontend.log || true
          exit 1
      - name: Run critical browser journey
        working-directory: frontend
        run: BOS_TRANSPORT_DIAGNOSTICS=1 NODE_OPTIONS="${NODE_OPTIONS:-} --require=$PWD/scripts/ci-transport-observer.cjs" pnpm exec playwright test
      - name: Preserve neutral workspace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutral-workspace-screenshots
          path: |
            frontend/test-results/**/neutral-theme-*.png
            /tmp/business-os-transport/*.ndjson
          if-no-files-found: warn
          retention-days: 7
      - name: Print service logs on failure
        if: failure()
        run: |
          echo "--- backend ---"
          cat /tmp/business-os-backend.log || true
          echo "--- frontend ---"
          cat /tmp/business-os-frontend.log || true

  admin-readonly:
    # Independent disposable DB/processes; never shares or modifies the60-case job.
    runs-on: ubuntu-latest
    timeout-minutes: 110
    services: *browser-fixture-services
    env: *browser-fixture-env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure private seed metadata and sanitized evidence paths
        run: |
          echo "ADMIN_SWEEP_FIXTURE=$RUNNER_TEMP/admin-readonly-fixture.json" >> "$GITHUB_ENV"
          echo "ADMIN_SWEEP_EVIDENCE=$GITHUB_WORKSPACE/frontend/admin-readonly-evidence" >> "$GITHUB_ENV"
      - name: Prepare isolated service-created read-only fixtures
        working-directory: backend
        run: |
          uv sync --frozen
          uv run --offline --no-sync python -m unittest discover -s tests -p "test_admin_readonly_*unit.py" -v
          uv run alembic upgrade head
          uv run python scripts/seed_browser_e2e.py
          uv run python scripts/seed_admin_readonly_sweep.py
          nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 >"$RUNNER_TEMP/admin-readonly-backend.log" 2>&1 &
      - name: Wait for isolated backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Isolated backend did not become ready; no retry or raw log upload."
          exit 1
      - run: corepack enable
      - name: Build production frontend for read-only render verification
        working-directory: frontend
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false @playwright/test@1.55.0
          node --test tests/admin-readonly-registry.test.cjs tests/admin-readonly-process.test.cjs
          pnpm build
      - name: Run explicit development read-only batches (production build separately verified)
        working-directory: frontend
        env:
          ADMIN_SWEEP_RUNTIME: development
          INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        run: node scripts/run-admin-readonly-sweep.mjs
      - name: Preserve only sanitized route evidence and masked screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-readonly-route-evidence
          path: |
            frontend/admin-readonly-evidence/batch-*.ndjson
            frontend/admin-readonly-evidence/route-evidence.json
            frontend/admin-readonly-evidence/captures-*/**/admin-readonly-*.png
          if-no-files-found: warn
          retention-days: 7
