name: Apply quotation revision policy patch

on:
  push:
    branches:
      - fix/quotation-revision-before-acceptance
    paths:
      - .github/workflows/apply-quotation-revision-before-acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quotation-revision-before-acceptance
      - name: Apply scoped quotation revision patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}:\n{old[:300]}")
              path.write_text(text.replace(old, new, 1))

          backend = Path('backend/app/api/v1/sales.py')
          replace_once(
              backend,
              '    if quotation.status != "draft":\n        raise HTTPException(status_code=409, detail="Only draft quotations can be edited")\n\n    before = {\n        "subject": quotation.subject,',
              '    editable_statuses = {"draft", "sent", "rejected"}\n    if quotation.status not in editable_statuses:\n        raise HTTPException(status_code=409, detail="Accepted or cancelled quotations are locked and cannot be edited")\n    previous_status = quotation.status\n\n    before = {\n        "status": quotation.status,\n        "subject": quotation.subject,',
          )
          replace_once(
              backend,
              '    if payload.items is not None:\n        _replace_items(db, quotation, payload.items)\n    elif "tax_calculation_mode" in changes:\n        _recalculate_items(db, quotation)\n    db.flush()\n    after = {\n        "subject": quotation.subject,',
              '    if payload.items is not None:\n        _replace_items(db, quotation, payload.items)\n    elif "tax_calculation_mode" in changes:\n        _recalculate_items(db, quotation)\n\n    revised_to_draft = previous_status in {"sent", "rejected"}\n    if revised_to_draft:\n        quotation.status = "draft"\n        quotation.sent_at = None\n        quotation.rejected_at = None\n\n    db.flush()\n    after = {\n        "status": quotation.status,\n        "subject": quotation.subject,',
          )
          replace_once(
              backend,
              '        message=f"Quotation updated: {quotation.quotation_number}",',
              '        message=(\n            f"Quotation revised and returned to draft: {quotation.quotation_number}"\n            if revised_to_draft\n            else f"Quotation updated: {quotation.quotation_number}"\n        ),',
          )

          frontend = Path('frontend/src/app/dashboard/quotations/quotation-workspace.tsx')
          replace_once(
              frontend,
              '  function openEdit(current: Detail) {\n    if (!meta || current.status !== "draft") return;',
              '  function openEdit(current: Detail) {\n    if (!meta || !["draft", "sent", "rejected"].includes(current.status)) return;',
          )
          replace_once(
              frontend,
              '      if (editingQuotationId) {\n        const updated = await api(`/quotations/${editingQuotationId}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(quotationPayload) }) as Detail;\n        setCreateOpen(false); setEditingQuotationId(null); setDetail(updated); setMessage(`Quotation ${updated.quotation_number} updated`); await refreshAffected();',
              '      if (editingQuotationId) {\n        const wasRevision = detail?.status === "sent" || detail?.status === "rejected";\n        const updated = await api(`/quotations/${editingQuotationId}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(quotationPayload) }) as Detail;\n        setCreateOpen(false); setEditingQuotationId(null); setDetail(updated); setMessage(wasRevision ? `Quotation ${updated.quotation_number} revised and returned to Draft. Mark it Sent again after review.` : `Quotation ${updated.quotation_number} updated`); await refreshAffected();',
          )
          replace_once(
              frontend,
              '    {sourceLeadId && !editingQuotationId ? <div className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700">Lead requirements are prefilled below. You can adjust descriptions, quantity and final pricing before saving the quotation.</div> : null}\n    <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">',
              '    {sourceLeadId && !editingQuotationId ? <div className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700">Lead requirements are prefilled below. You can adjust descriptions, quantity and final pricing before saving the quotation.</div> : null}\n    {editingQuotationId && detail && (detail.status === "sent" || detail.status === "rejected") ? <div className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">This quotation was already {detail.status}. Saving a revision will return it to Draft so you can review and send the updated version again.</div> : null}\n    <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">',
          )
          replace_once(
              frontend,
              '{detail.status === "draft" ? <><Action label="Edit" disabled={saving} onClick={() => onEdit(detail)} /><Action label="Mark Sent" primary disabled={saving} onClick={() => void onStatus("sent")} /><Action label="Cancel" disabled={saving} onClick={() => void onStatus("cancelled")} /></> : null}{detail.status === "sent" ? <><Action label="Accept" primary disabled={saving} onClick={() => void onStatus("accepted")} /><Action label="Reject" disabled={saving} onClick={() => void onStatus("rejected")} /></> : null}{detail.status === "accepted" ? <Action label="Create / View Order" primary onClick={() => onOrder(detail.id)} /> : null}',
              '{detail.status === "draft" ? <><Action label="Edit" disabled={saving} onClick={() => onEdit(detail)} /><Action label="Mark Sent" primary disabled={saving} onClick={() => void onStatus("sent")} /><Action label="Cancel" disabled={saving} onClick={() => void onStatus("cancelled")} /></> : null}{detail.status === "sent" ? <><Action label="Edit" disabled={saving} onClick={() => onEdit(detail)} /><Action label="Accept" primary disabled={saving} onClick={() => void onStatus("accepted")} /><Action label="Reject" disabled={saving} onClick={() => void onStatus("rejected")} /></> : null}{detail.status === "rejected" ? <Action label="Revise" disabled={saving} onClick={() => onEdit(detail)} /> : null}{detail.status === "accepted" ? <Action label="Create / View Order" primary onClick={() => onOrder(detail.id)} /> : null}',
          )

          verify = Path('backend/scripts/verify_sales_catalog_flow.py')
          replace_once(verify, 'from app.api.v1.sales import change_quotation_status, create_quotation', 'from app.api.v1.sales import change_quotation_status, create_quotation, update_quotation')
          replace_once(verify, 'from app.schemas.sales import QuotationCreate, QuotationItemInput, QuotationStatusChange', 'from app.schemas.sales import QuotationCreate, QuotationItemInput, QuotationStatusChange, QuotationUpdate')

          text = verify.read_text()
          marker = '        sent = change_quotation_status(quotation.id, QuotationStatusChange(status="sent"), req("PATCH", f"/sales/quotations/{quotation.id}/status"), db, tenant)  # type: ignore[arg-type]'
          if marker not in text:
              raise SystemExit('Quotation status marker not found in verify_sales_catalog_flow.py')
          revision_block = '''        revision_quote = create_quotation(
              QuotationCreate(
                  client_id=client_id,
                  subject="Negotiation revision",
                  issue_date=date.today(),
                  currency=currency,
                  items=[QuotationItemInput(item_name="Negotiation service", item_type="service", unit="project", description="Negotiation service", quantity=Decimal("1"), unit_price=Decimal("100"))],
              ),
              req("POST", "/sales/quotations"),
              db,
              tenant,  # type: ignore[arg-type]
          )
          revision_sent = change_quotation_status(revision_quote.id, QuotationStatusChange(status="sent"), req("PATCH", f"/sales/quotations/{revision_quote.id}/status"), db, tenant)  # type: ignore[arg-type]
          revised = update_quotation(
              revision_sent.id,
              QuotationUpdate(
                  subject="Negotiated price",
                  items=[QuotationItemInput(item_name="Negotiation service", item_type="service", unit="project", description="Negotiation service", quantity=Decimal("1"), unit_price=Decimal("80"))],
              ),
              req("PATCH", f"/sales/quotations/{revision_sent.id}"),
              db,
              tenant,  # type: ignore[arg-type]
          )
          if revised.status != "draft" or revised.total != Decimal("80.00") or revised.sent_at is not None:
              raise AssertionError(f"sent quotation revision did not return to draft safely: {revised}")
          revision_resent = change_quotation_status(revised.id, QuotationStatusChange(status="sent"), req("PATCH", f"/sales/quotations/{revised.id}/status"), db, tenant)  # type: ignore[arg-type]
          revision_rejected = change_quotation_status(revision_resent.id, QuotationStatusChange(status="rejected"), req("PATCH", f"/sales/quotations/{revision_resent.id}/status"), db, tenant)  # type: ignore[arg-type]
          reopened = update_quotation(
              revision_rejected.id,
              QuotationUpdate(subject="Second revision"),
              req("PATCH", f"/sales/quotations/{revision_rejected.id}"),
              db,
              tenant,  # type: ignore[arg-type]
          )
          if reopened.status != "draft" or reopened.sent_at is not None or reopened.rejected_at is not None:
              raise AssertionError(f"rejected quotation revision did not return to draft safely: {reopened}")
          revision_final_sent = change_quotation_status(reopened.id, QuotationStatusChange(status="sent"), req("PATCH", f"/sales/quotations/{reopened.id}/status"), db, tenant)  # type: ignore[arg-type]
          revision_accepted = change_quotation_status(revision_final_sent.id, QuotationStatusChange(status="accepted"), req("PATCH", f"/sales/quotations/{revision_final_sent.id}/status"), db, tenant)  # type: ignore[arg-type]
          expect(409, lambda: update_quotation(
              revision_accepted.id,
              QuotationUpdate(subject="Accepted quotation must stay locked"),
              req("PATCH", f"/sales/quotations/{revision_accepted.id}"),
              db,
              tenant,  # type: ignore[arg-type]
          ))
          db.rollback()

'''
          verify.write_text(text.replace(marker, revision_block + marker, 1))

          Path('.github/workflows/apply-quotation-revision-before-acceptance.yml').unlink()
          PY
      - name: Commit scoped change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/v1/sales.py backend/scripts/verify_sales_catalog_flow.py frontend/src/app/dashboard/quotations/quotation-workspace.tsx .github/workflows/apply-quotation-revision-before-acceptance.yml
          git commit -m "fix(sales): allow quotation revisions before acceptance"
          git push origin HEAD:fix/quotation-revision-before-acceptance
