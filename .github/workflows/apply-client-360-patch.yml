name: Apply Client 360 patch

on:
  push:
    branches:
      - feat/client-360-workspace
    paths:
      - scripts/_apply_client_360_patch.py
      - .github/workflows/apply-client-360-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-360-workspace
      - name: Apply patch
        run: python scripts/_apply_client_360_patch.py
      - name: Commit patch
        run: |
          rm scripts/_apply_client_360_patch.py
          rm .github/workflows/apply-client-360-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(clients): integrate client 360 workspace"
          git push origin HEAD:feat/client-360-workspace
